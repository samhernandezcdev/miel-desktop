[package]
name = "miel"
version = "0.1.0"
description = "Miel: mascota de escritorio para Windows 11"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "miel_lib"
crate-type = ["rlib"]

[dev-dependencies]
# runtime simulado: permite leer los elementos reales del menú sin sesión gráfica
tauri = { version = "2", features = ["tray-icon", "test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

# Solo Windows: aviso nativo de cambios de pantalla (misma versión que ya usa Tauri; sin crates nuevos).
[features]
# Herramientas de diagnóstico/medición en una compilación de producción (NO se usa en el instalador).
diag = []

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
