# Integración continua de Miel Desktop (solo Windows: el producto es solo Windows 11 x64).
# Permisos mínimos: solo lectura del contenido. No publica nada ni usa secretos.
# Las acciones están fijadas por SHA de commit (el comentario indica la versión); se actualizan a mano (docs/DEPENDENCY_UPDATES.md).
# Checks OBLIGATORIOS de la rama main: `licenses`, `frontend` y `rust` (ver docs/PUBLISHING_CHECKLIST.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: licenses
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OBLIGATORIO. Falla si Cargo.lock o package-lock.json cambiaron sin regenerar THIRD_PARTY_LICENSES.txt.
      # Para arreglarlo: ver docs/DEPENDENCY_UPDATES.md (`python -I tools/gen_third_party_licenses.py`, requiere cargo-about y `npm ci`).
      - name: THIRD_PARTY_LICENSES.txt coincide con los lockfiles
        run: python -I tools/gen_third_party_licenses.py --check

  frontend:
    name: frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
      - name: Build (incluye check:dist)
        run: npm run build
      - name: check:dist (CSS del rig como archivo propio, sin style embebido)
        run: npm run check:dist

  rust:
    name: rust
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Tauri necesita `dist/` (frontendDist) para compilar el crate, también en las pruebas.
      - run: npm ci
      - run: npm run build
      - name: Rust estable con clippy
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
